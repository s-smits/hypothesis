<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodes · node-dag</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar input { flex: 1 1 240px; background: var(--panel); }
  .node > summary {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px;
    align-items: baseline; padding: 12px 16px; cursor: pointer; list-style: none;
  }
  .node > summary::-webkit-details-marker { display: none; }
  .node > summary:hover { background: var(--accent-bg); }
  .node > summary::before { content: "›"; color: var(--muted); font-size: 15px; line-height: 1; transition: transform .15s; }
  .node[open] > summary::before { transform: rotate(90deg); }
  .node .name { font-weight: 600; }
  .node > summary .desc { grid-column: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node > .body { padding: 6px 16px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 20px; }
  .cat { font-size: 11px; font-weight: 600; color: #fff; background: var(--running); border-radius: 10px; padding: 1px 8px; }
  .cat.scoring { background: var(--done); }
  .cat.filter { background: var(--amber); }
  pre { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses">Hypotheses</a><a href="/new">New</a><a href="/nodes" class="here">Nodes</a></nav>
  <span id="updated"></span>
</header>
<main>
  <div class="bar">
    <span class="meta" id="count"></span>
    <input id="search" type="search" placeholder="Filter by name, description, score column…" autocomplete="off">
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>
<script>
const POLL_MS = 3000;
let nodes = null;        // The last /api/nodes response.
let last = "";           // What was last drawn, to redraw only on change.
const open = new Set();  // Which nodes the user has opened.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const chip = (s) => `<span class="chip">${esc(s)}</span>`;

// Everything a search should match on one node.
const haystack = (n) => [n.node, n.description, n.filters_on, ...Object.values(n.score_columns ?? {})].join(" ").toLowerCase();

// Name and description on the line; ports, score columns and config behind it.
function card(n) {
  const cols = Object.entries(n.score_columns ?? {});
  return `
    <details class="node" data-key="${esc(n.node)}"${open.has(n.node) ? " open" : ""}>
      <summary>
        <span class="name">${esc(n.config.name)}</span>
        <span class="chips">${n.categories.map((c) => `<span class="cat ${esc(c)}">${esc(c)}</span>`).join("")}</span>
        <span class="desc meta">${esc(n.description)}</span>
      </summary>
      <div class="body">
        <div class="meta mono">${esc(n.node)}</div>
        <div class="cols">
          <div><div class="label">Input</div><div class="chips">${Object.entries(n.input).map(([port, kind]) => chip(`${port}: ${kind}`)).join("")}</div></div>
          <div><div class="label">Outputs</div><div class="chips">${Object.entries(n.outputs).map(([src, kind]) => chip(`${src}: ${kind}`)).join("")}</div></div>
          ${n.filters_on ? `<div><div class="label">Filters on</div><div class="chips">${chip(n.filters_on)}</div></div>` : ""}
        </div>
        ${cols.length ? `
          <div>
            <div class="label">Score columns</div>
            <table><tbody>${cols.map(([name, col]) => `<tr><td>${esc(name)}</td><td><code>${esc(col)}</code></td></tr>`).join("")}</tbody></table>
          </div>` : ""}
        <div><div class="label" style="margin-bottom:4px">Config</div><pre>${esc(JSON.stringify(n.config, null, 2))}</pre></div>
      </div>
    </details>`;
}

function draw() {
  if (nodes === null) return;
  const q = $("#search").value.trim().toLowerCase();
  const shown = nodes.filter((n) => haystack(n).includes(q));
  $("#count").innerHTML = `<b>${shown.length}</b> of ${nodes.length} registered ${nodes.length === 1 ? "node" : "nodes"}`;
  const html = !nodes.length
    ? `<div class="empty">No nodes yet. A builder agent registers each node it makes while it works on a hypothesis.</div>`
    : shown.length ? `<div class="rows">${shown.map(card).join("")}</div>` : `<div class="empty">Nothing matches “${esc(q)}”.</div>`;
  if (html === last) return;
  last = html;
  $("#list").innerHTML = html;
}

// Remember what is open, so the poll's redraw does not close it.
$("#list").addEventListener("toggle", (e) => {
  const el = e.target;
  if (!el.dataset.key) return;
  el.open ? open.add(el.dataset.key) : open.delete(el.dataset.key);
}, true);

async function load() {
  try {
    const r = await fetch("/api/nodes");
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
    nodes = await r.json();
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
    draw();
  } catch (e) {
    $("#updated").textContent = `could not load: ${e.message}`;
  }
}

$("#search").addEventListener("input", draw);
load();
setInterval(load, POLL_MS);
</script>
</body>
</html>
