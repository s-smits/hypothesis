<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-dag runs</title>
<script src="https://unpkg.com/@ebay/nice-dag-core@1.0.45/lib/index.umd.cjs"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pending: #9ca3af; --running: #2563eb; --done: #16a34a; --skipped: #d1d5db; --failed: #dc2626;
    --accent-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b313c;
      --pending: #6b7280; --running: #60a5fa; --done: #4ade80; --skipped: #3a404b; --failed: #f87171;
      --accent-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); font-size: 12px; }
  header nav { display: flex; gap: 12px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a.here { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: calc(100vh - 47px); }
  @media (max-width: 760px) { main { grid-template-columns: minmax(0, 1fr); height: auto; } #runs { max-height: 40vh; } }
  #runs { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  .run { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .run:hover { background: var(--bg); }
  .run.selected { background: var(--accent-bg); }
  .run .id { font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .meta { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; text-transform: lowercase; }
  .s-RUNNING, .s-running { background: var(--running); }
  .s-COMPLETED, .s-done { background: var(--done); }
  .s-FAILED, .s-TERMINATED, .s-TIMED_OUT, .s-CANCELED, .s-failed { background: var(--failed); }
  .s-pending { background: var(--pending); }
  .s-skipped { background: var(--skipped); color: var(--muted); }
  .s-kept { background: var(--done); }
  .s-out { background: var(--failed); }
  #detail { overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .empty { color: var(--muted); padding: 20px; }
  .summary { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .summary h2 { font: 600 15px ui-monospace, monospace; margin: 0; word-break: break-all; min-width: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; display: flex; }
  .bar > div { height: 100%; transition: width .3s; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .counts i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  /* Somewhere to watch a step's work, e.g. its GPU run on Modal. */
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { font-size: 12px; text-decoration: none; color: var(--running); border: 1px solid var(--running); border-radius: 10px; padding: 1px 10px; }
  .links a:hover { background: var(--accent-bg); }
  .links .step { font-family: ui-monospace, monospace; color: var(--muted); }
  .error { background: color-mix(in srgb, var(--failed) 12%, transparent); border: 1px solid var(--failed); border-radius: 6px; padding: 8px 12px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }

  /* The two views, and the toggle inside the node panel. */
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; padding: 4px 14px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent-bg); color: var(--text); font-weight: 600; }
  #tabs { display: flex; align-items: center; gap: 12px; }

  /* The graph gets a fixed share of the screen, and the drawing is scaled to fit it. */
  #graph { position: relative; height: clamp(280px, 46vh, 520px); flex: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .node { width: 100%; height: 100%; border: 2px solid var(--pending); border-radius: 8px; background: var(--panel); padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
  .node .k { font-weight: 600; font-family: ui-monospace, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .n { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node.input { border-style: dashed; border-color: var(--done); }
  .node.running { border-color: var(--running); animation: pulse 1.2s ease-in-out infinite; }
  .node.done { border-color: var(--done); }
  .node.failed { border-color: var(--failed); }
  .node.skipped { border-color: var(--skipped); opacity: .55; }
  .node.picked { box-shadow: 0 0 0 3px var(--accent-bg), 0 0 0 5px var(--running); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--running) 25%, transparent); } }

  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td code { font-size: 12px; }

  #data { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #data .scroll { overflow-x: auto; }
  .dhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dhead h3 { margin: 0; font-size: 14px; }
  .dhead .toggle { margin-left: auto; display: flex; gap: 8px; }
  .plain { font: inherit; font-size: 12px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  .meta { color: var(--muted); font-size: 12px; }
  .hint { color: var(--muted); padding: 14px 4px; }
  table.frame td, table.frame th { padding: 5px 12px; }
  table.frame th .sub { font-size: 10px; font-weight: 400; }
  table.frame th.hl { color: var(--text); box-shadow: inset 0 -2px var(--running); }
  table.frame .id { font-size: 11px; color: var(--muted); }
  table.frame .seq { font-size: 12px; }
  table.frame .kind, table.frame .na { color: var(--muted); font-size: 11px; }
  table.frame tr.out td { opacity: .55; }
  table.frame tr.out .seq { text-decoration: line-through; }
  table.kv { width: auto; min-width: 360px; }
  table.kv th { width: 1%; white-space: nowrap; color: var(--muted); font-weight: 500; }
  table.kv td { word-break: break-all; }
  h4 { margin: 10px 0 2px; font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }

  /* A structure, full screen, in Mol*. */
  table.frame .view { font: inherit; font-size: 11px; background: var(--panel); color: var(--running); border: 1px solid var(--running); border-radius: 6px; padding: 1px 10px; cursor: pointer; }
  table.frame .view:hover { background: var(--accent-bg); }
  #viewer { position: fixed; inset: 0; z-index: 50; background: var(--panel); display: none; flex-direction: column; }
  #viewer.on { display: flex; }
  #viewer .vhead { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  #viewer .vhead h3 { margin: 0; font: 600 13px ui-monospace, monospace; }
  #viewer .vhead button { margin-left: auto; }
  /* Mol* sizes itself to this box, and draws its own light theme inside it. */
  #vmount { position: relative; flex: 1; min-height: 0; background: #fff; }
  #vmount .msg { padding: 20px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/" class="here">Runs</a><a href="/hypotheses">Hypotheses</a><a href="/observations">Observations</a><a href="/new">New</a><a href="/nodes">Nodes</a></nav>
  <span id="updated"></span>
</header>
<main>
  <nav id="runs"><div class="empty">Loading…</div></nav>
  <section id="detail"><div class="empty">Select a run.</div></section>
</main>
<div id="viewer" aria-hidden="true">
  <div class="vhead">
    <h3 id="vtitle"></h3>
    <span class="meta" id="vmeta"></span>
    <button class="plain" id="vclose" title="Esc">Close</button>
  </div>
  <div id="vmount"></div>
</div>
<script>
const POLL_MS = 2000;
const STATUSES = ["done", "running", "pending", "skipped", "failed"];
const NODE_SIZE = { width: 150, height: 52 };
const params = new URLSearchParams(location.search);
let selected = params.get("run");
let view = params.get("view") === "table" ? "table" : "graph";   // "table" or "graph".
let tab = "data";        // In the graph view, what a picked node shows: "data" or "config".
let picked = null;       // The step or input the user clicked.
let dag = null;          // The nice-dag instance.
let lastRender = "";     // What the graph last drew, to redraw only on change.
let lastData = "";       // What the data panel last drew.
let detail = null;       // The last RunDetail for the selected run.
let links = {};          // Where to watch each step's work, keyed by step.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const ago = (t) => {
  const s = Math.round((Date.now() - new Date(t)) / 1000);
  return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : new Date(t).toLocaleString();
};
// A config value for people: a sequence by its display string, the rest as JSON.
const argText = (v) => v && typeof v === "object" && v.display ? v.display : JSON.stringify(v);
const countOf = (t) => t ? `${t.items.length} × ${t.items[0]?.kind ?? "empty"}` : "waiting";

function syncUrl() {
  history.replaceState(null, "", `?run=${encodeURIComponent(selected)}&view=${view}`);
}

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`);
  return r.json();
}

async function loadRuns() {
  const runs = await getJSON("/api/runs");
  $("#runs").innerHTML = runs.length ? runs.map((r) => `
    <div class="run ${r.id === selected ? "selected" : ""}" data-id="${esc(r.id)}">
      <div class="id" title="${esc(r.id)}">${esc(r.id)}</div>
      <div class="meta"><span class="badge s-${r.status}">${r.status}</span><span>${ago(r.start_time)}</span></div>
    </div>`).join("") : `<div class="empty">No DagWorkflow runs yet. Start one with<br><code>uv run python -m temporal.run_workflow examples/simple.json</code></div>`;
  if (!selected && runs.length) select(runs[0].id);
}

function select(id) {
  if (id === selected) return;
  selected = id; picked = null; lastRender = ""; lastData = "";
  syncUrl();
  document.querySelectorAll(".run").forEach((el) => el.classList.toggle("selected", el.dataset.id === id));
  $("#detail").innerHTML = `<div class="empty">Loading…</div>`;
  loadDetail();
}

// One entry per DAG input and step: its key, status and a one-line description of the node.
function rows(p) {
  const out = Object.entries(p.dag.inputs).map(([k, kind]) => ({ key: k, status: "input", node: `input: ${kind}` }));
  for (const [k, step] of Object.entries(p.dag.steps)) {
    const { name, config_hash, ...args } = step.config;
    const text = Object.entries(args).map(([a, v]) => `${a}=${argText(v)}`).join(", ");
    out.push({ key: k, status: p.steps[k], node: text ? `${name}(${text})` : name });
  }
  return out;
}

function renderGraph(p) {
  const key = JSON.stringify([selected, p.steps, Object.keys(p.values), picked, matchMedia("(prefers-color-scheme: dark)").matches]);
  if (key === lastRender) return;
  lastRender = key;
  const byKey = Object.fromEntries(rows(p).map((r) => [r.key, r]));
  // What a step reads: its inputs and, for a filter with a reference, the step that scored it.
  const reads = (k) => {
    const step = p.dag.steps[k];
    return step ? [...Object.values(step.inputs), ...(step.config.scored_in ? [step.config.scored_in] : [])] : [];
  };
  const nodes = Object.keys(byKey).map((k) => ({
    id: k,
    dependencies: [...new Set(reads(k).map((s) => s.split(".")[0]))],
  }));
  // An edge is "used" once its source has produced the value the target reads.
  const used = (src, tgt) => reads(tgt).some((s) => s.split(".")[0] === src && s in p.values);
  dag?.destory();
  $("#graph").innerHTML = "";
  dag = niceDag.init({
    container: $("#graph"),
    mode: "DEFAULT", // Draw an edge per dependency, with no joint nodes in between.
    getNodeSize: () => NODE_SIZE,
    graphLabel: { rankdir: "LR", ranksep: 50, nodesep: 24 },
    rootViewPadding: { top: 20, left: 20, right: 20, bottom: 20 },
    gridConfig: { visible: false },
    getEdgeAttributes: ({ source, target }) => ({ color: used(source.id, target.id) ? css("--done") : css("--skipped") }),
    mapNodeToElement: ({ id }) => {
      const r = byKey[id];
      const el = document.createElement("div");
      el.className = `node ${r.status}${id === picked ? " picked" : ""}`;
      el.title = `${id}: ${r.status}\n${r.node}`;
      el.innerHTML = `<div class="k">${esc(id)}</div><div class="n">${esc(r.node)}</div>`;
      el.onclick = () => pick(id);
      return el;
    },
  });
  dag.withNodes(nodes).render();
  fitGraph();
}

// Scale the drawing down to fit the box, in both directions. Never scale it up.
function fitGraph() {
  const box = $("#graph"), content = dag.getRootContentElement();
  dag.setScale(1);
  const scale = Math.min(1, box.clientWidth / content.scrollWidth, box.clientHeight / content.scrollHeight);
  dag.setScale(scale);
}

function pick(id) {
  picked = picked === id ? null : id;
  if (detail) renderDetail(detail);
}

// ---- Tables: sequences as rows, score columns as columns. ----
const MAX_ROWS = 500;
const fmt = (v) => v == null ? `<span class="na">–</span>` : Number.isInteger(v) ? String(v) : v.toFixed(3);
// "ostir_expression__1463740e__expression" is the score expression of node ostir_expression, config 1463740e.
const colLabel = (col) => {
  const [node, hash, ...rest] = col.split("__");
  return rest.length ? { label: rest.join("__"), sub: `${node} · ${hash}`, title: col } : { label: col, title: col };
};

// ---- Structures, full screen, in Mol*. ----
// The viewer is 5 MB, so it is fetched the first time someone asks to see a
// structure, and the plugin it makes is then kept and reloaded for the next one.
const MOLSTAR = "https://cdn.jsdelivr.net/npm/molstar@4.18.0/build/viewer/molstar";
const structures = new Map();   // Entity id -> the entity, for everything drawn so far.
let plugin = null;              // The Mol* viewer, once someone has opened one.
let loading = null;             // The in-flight fetch of the Mol* bundle.

const hasStructure = (it) => typeof it.structure === "string" && it.structure !== "";

function loadMolstar() {
  loading ??= new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = `${MOLSTAR}.css`;
    const js = document.createElement("script");
    js.src = `${MOLSTAR}.js`;
    js.onload = resolve;
    js.onerror = () => reject(new Error(`Could not load Mol* from ${MOLSTAR}.js`));
    document.head.append(css, js);
  });
  return loading;
}

async function showStructure(id) {
  const it = structures.get(id);
  if (!it) return;
  $("#viewer").classList.add("on");
  $("#viewer").setAttribute("aria-hidden", "false");
  $("#vtitle").textContent = id;
  $("#vmeta").textContent = `${it.kind} · ${it.sequence.length} residues`;
  try {
    await loadMolstar();
    plugin ??= await molstar.Viewer.create($("#vmount"), {
      layoutIsExpanded: false, layoutShowControls: false, layoutShowLog: false,
      layoutShowLeftPanel: false, viewportShowAnimation: false,
    });
    await plugin.plugin.clear();  // Whatever was shown last is not this structure.
    await plugin.loadStructureFromData(it.structure, "mmcif");
    // clear() leaves the camera where the last structure left it, which on a reused
    // viewer opens the next one zoomed into wherever you happened to be.
    plugin.plugin.managers.camera.reset();
  } catch (e) {
    $("#vmount").innerHTML = `<div class="msg">${esc(e.message)}</div>`;
  }
}

function closeStructure() {
  $("#viewer").classList.remove("on");
  $("#viewer").setAttribute("aria-hidden", "true");
}

// An HTML table. cols are {label, sub?, title?, hl?}; rows are {cells: [html], cls?}.
function frame(cols, rows) {
  const head = cols.map((c) => `<th title="${esc(c.title ?? c.label)}"${c.hl ? ' class="hl"' : ""}>${esc(c.label)}${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ""}</th>`).join("");
  const body = rows.slice(0, MAX_ROWS).map((r) => `<tr${r.cls ? ` class="${r.cls}"` : ""}>${r.cells.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("");
  return `<div class="scroll"><table class="frame"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${rows.length > MAX_ROWS ? `<div class="meta">Showing the first ${MAX_ROWS} of ${rows.length} rows.</div>` : ""}`;
}

// Entities as rows: id, kind, str, then a column for each of `cols`, then any `extra` cells.
// An entity that carries a structure also gets a button that shows it in Mol*.
function entities(items, scores, cols, { hl, extraCols = [], extra = () => [], cls = () => "" } = {}) {
  const foldable = items.filter(hasStructure);
  foldable.forEach((it) => structures.set(it.id, it));
  return frame(
    [{ label: "id" }, { label: "kind" }, { label: "str" }, ...cols.map((c) => ({ ...colLabel(c), hl: c === hl })), ...extraCols,
      ...(foldable.length ? [{ label: "structure" }] : [])],
    items.map((it) => ({
      cells: [`<code class="id">${esc(it.id)}</code>`, `<span class="kind">${esc(it.kind)}</span>`, `<code class="seq">${esc(it.display ?? it.sequence)}</code>`,
        ...cols.map((c) => fmt(scores[c]?.[it.id])), ...extra(it),
        ...(foldable.length ? [hasStructure(it) ? `<button class="view" data-view-id="${esc(it.id)}">View</button>` : `<span class="na">–</span>`] : [])],
      cls: cls(it),
    })),
  );
}

// A two-column table of names and values.
const kv = (pairs) => `<table class="kv"><tbody>${pairs.map(([k, v]) => `<tr><th>${esc(k)}</th><td><code>${esc(v)}</code></td></tr>`).join("")}</tbody></table>`;

// Table view: every sequence the run touched, with every score column.
function tableView(p) {
  const byId = new Map(), cols = [], scores = {};
  for (const t of Object.values(p.values)) {
    for (const it of t.items) if (!byId.has(it.id)) byId.set(it.id, it);
    for (const [c, by] of Object.entries(t.scores)) {
      if (!cols.includes(c)) cols.push(c);
      scores[c] = { ...scores[c], ...by };
    }
  }
  const items = [...byId.values()];
  return `<div class="dhead"><h3>All sequences</h3><span class="meta">${items.length} sequences × ${cols.length} score columns</span></div>`
    + (items.length ? entities(items, scores, cols) : `<div class="hint">No sequences yet.</div>`);
}

// What went through a picked step or input: the sequences in and out, and their scores.
function nodeData(p, key) {
  if (key in p.dag.inputs) {
    const t = p.values[key] ?? { items: [], scores: {} };
    return { meta: `${t.items.length} × ${p.dag.inputs[key]}`, html: entities(t.items, {}, []) };
  }
  const step = p.dag.steps[key], { name, ...args } = step.config;
  const [src] = Object.values(step.inputs);
  const inT = p.values[src];
  if (!inT) return { meta: p.steps[key], html: `<div class="hint">Waiting for <code>${esc(src)}</code>.</div>` };
  const inCols = Object.keys(inT.scores);
  const yes = p.values[`${key}.yes`], no = p.values[`${key}.no`], out = p.values[key];
  const empty = `<div class="hint">No sequences reached this step, so it was skipped.</div>`;

  if ("column" in args) {  // A filter: every input row, and whether it was kept.
    if (!yes) return { meta: `${inT.items.length} in · ${p.steps[key]}`, html: inT.items.length ? entities(inT.items, inT.scores, inCols, { hl: args.column }) : empty };
    const kept = new Set(yes.items.map((i) => i.id));
    const op = name === "at_most" ? "≤" : name === "at_least" ? "≥" : "vs";
    const ref = args.reference;  // beats_reference compares with a measured score, not a threshold.
    const bound = ref ? `beats ${ref.kind} ${ref.sequence.slice(0, 12)} scored in ${args.scored_in}${args.higher === false ? " (lower is better)" : ""}` : `${op} ${args.threshold}`;
    return {
      meta: `${colLabel(args.column).label} ${bound} · ${yes.items.length} kept, ${no.items.length} filtered out`,
      html: entities(inT.items, inT.scores, inCols, {
        hl: args.column,
        extraCols: [{ label: "result" }],
        extra: (it) => [kept.has(it.id) ? `<span class="badge s-kept">kept</span>` : `<span class="badge s-out">filtered out</span>`],
        cls: (it) => (kept.has(it.id) ? "" : "out"),
      }),
    };
  }
  const added = out ? Object.keys(out.scores).filter((c) => !(c in inT.scores)) : [];
  if (out && added.length) {  // A scorer: the inputs and the scores it added.
    return { meta: `${inT.items.length} in · ${added.length} score columns added`, html: entities(inT.items, out.scores, added) };
  }
  const inputs = `<h4>Inputs · ${inT.items.length} from ${esc(src)}</h4>` + entities(inT.items, {}, []);
  if (!out) return { meta: p.steps[key], html: inT.items.length ? inputs : empty };
  return { meta: `${inT.items.length} in · ${out.items.length} out`, html: inputs + `<h4>Outputs · ${out.items.length}</h4>` + entities(out.items, {}, []) };
}

// Where to watch a step's work: the links it reported, e.g. its GPU run on Modal.
// withStep labels each one, for a list that mixes steps.
function linkList(step, withStep = false) {
  const here = links[step] ?? [];
  if (!here.length) return "";
  return `<div class="links">${here.map((l) => `
    <a href="${esc(l.url)}" target="_blank" rel="noopener">${withStep ? `<span class="step">${esc(step)}</span> ` : ""}${esc(l.label)} ↗</a>`).join("")}</div>`;
}

// A picked step's node config, what feeds it, and what it made.
function nodeConfig(p, key) {
  if (key in p.dag.inputs) {
    return { meta: "DAG input", html: kv([["kind", p.dag.inputs[key]], ["sequences", countOf(p.values[key])]]) };
  }
  const step = p.dag.steps[key], { name, config_hash, ...args } = step.config;
  const made = Object.keys(p.values).filter((k) => k === key || k.startsWith(`${key}.`));
  return {
    meta: p.steps[key],
    html: `<h4>Config</h4>` + kv([["node", name], ["config_hash", config_hash], ...Object.entries(args).map(([a, v]) => [a, argText(v)])])
      + `<h4>Inputs</h4>` + kv(Object.entries(step.inputs).map(([port, src]) => [`${port} ←`, `${src} · ${countOf(p.values[src])}`]))
      + `<h4>Outputs</h4>` + (made.length ? kv(made.map((k) => [k, countOf(p.values[k])])) : `<div class="meta">Not run yet.</div>`)
      + (links[key]?.length ? `<h4>Running elsewhere</h4>` + linkList(key) : ""),
  };
}

// Graph view, below the drawing: the picked node as its data or its config.
function nodePanel(p) {
  if (picked == null || !(picked in p.dag.inputs || picked in p.dag.steps)) {
    return `<div class="hint">Click a node to see its config and inputs, or its sequences and scores.</div>`;
  }
  const step = p.dag.steps[picked];
  const { meta, html } = tab === "config" ? nodeConfig(p, picked) : nodeData(p, picked);
  return `
    <div class="dhead">
      <h3><code>${esc(picked)}</code>${step ? ` · ${esc(step.config.name)}` : ""}</h3>
      <span class="meta">${esc(meta)}</span>
      <div class="toggle">
        <div class="seg">
          <button data-tab="data" class="${tab === "data" ? "on" : ""}">Sequences × scores</button>
          <button data-tab="config" class="${tab === "config" ? "on" : ""}">Config &amp; inputs</button>
        </div>
        <button class="plain" id="clear" title="Esc">Deselect</button>
      </div>
    </div>` + html;
}

function renderData(p) {
  const html = view === "table" ? tableView(p) : nodePanel(p);
  if (html === lastData) return;
  lastData = html;
  $("#data").innerHTML = html;
}

function renderDetail(d) {
  const p = d.progress;
  links = d.links ?? {};
  // A step whose work is on a GPU somewhere else: offer it while it runs, without
  // making you find the node first.
  const watching = p ? Object.keys(p.steps).filter((k) => p.steps[k] === "running" && links[k]?.length) : [];
  const counts = p ? STATUSES.map((s) => [s, Object.values(p.steps).filter((x) => x === s).length]) : [];
  const total = p ? Object.keys(p.steps).length : 0;
  const finished = counts.filter(([s]) => s !== "pending" && s !== "running").reduce((a, [, n]) => a + n, 0);
  const summary = `
    <div class="summary">
      <h2>${esc(d.id)}</h2><span class="badge s-${d.status}">${d.status}</span>
      <span style="color:var(--muted)">started ${ago(d.start_time)}${d.close_time ? `, took ${((new Date(d.close_time) - new Date(d.start_time)) / 1000).toFixed(1)}s` : ""}</span>
    </div>
    ${p ? `
    <div>
      <div class="bar">${counts.map(([s, n]) => `<div class="s-${s}" style="width:${(n / total) * 100}%"></div>`).join("")}</div>
      <div class="counts" style="margin-top:6px">
        <span><b>${finished}/${total}</b> steps finished</span>
        ${counts.filter(([, n]) => n).map(([s, n]) => `<span><i class="s-${s}"></i>${n} ${s}</span>`).join("")}
      </div>
    </div>` : ""}
    ${watching.length ? `<div class="links">${watching.map((k) => linkList(k, true)).join("")}</div>` : ""}
    ${d.error ? `<div class="error">${esc(d.error)}</div>` : ""}`;

  const el = $("#detail");
  if (!$("#graph") || el.dataset.run !== d.id) {
    el.dataset.run = d.id;
    el.innerHTML = `<div id="summary"></div><div id="tabs"></div><div id="graph"></div><div id="data"></div>`;
    lastRender = ""; lastData = "";
  }
  $("#summary").innerHTML = summary;
  if (!p) { $("#tabs").innerHTML = ""; $("#graph").style.display = "none"; $("#data").innerHTML = ""; lastData = ""; return; }
  $("#tabs").innerHTML = `<div class="seg">
    <button data-view="graph" class="${view === "graph" ? "on" : ""}">Graph</button>
    <button data-view="table" class="${view === "table" ? "on" : ""}">Table</button></div>`;
  $("#graph").style.display = view === "graph" ? "" : "none";
  if (view === "graph") renderGraph(p);
  renderData(p);
}

function setView(v) {
  if (v === view) return;
  view = v; lastRender = ""; lastData = "";
  syncUrl();
  if (detail) renderDetail(detail);
}

async function loadDetail() {
  if (!selected) return;
  const id = selected;
  try {
    const d = await getJSON(`/api/runs/${encodeURIComponent(id)}`);
    if (id !== selected) return;
    detail = d;
    renderDetail(d);
  } catch (e) {
    $("#detail").innerHTML = `<div class="error">${esc(e.message)}</div>`;
  }
}

$("#detail").addEventListener("click", (e) => {
  const s = e.target.closest("[data-view-id]");
  if (s) return showStructure(s.dataset.viewId);
  const v = e.target.closest("[data-view]"), t = e.target.closest("[data-tab]");
  if (v) return setView(v.dataset.view);
  if (t) { tab = t.dataset.tab; lastData = ""; return detail && renderDetail(detail); }
  if (e.target.closest("#clear")) return pick(null);
  // Clicking on nothing in the graph view deselects.
  if (view === "graph" && picked != null && !e.target.closest(".node, #data, #tabs")) pick(null);
});
$("#vclose").onclick = closeStructure;
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  // The structure is on top of everything, so Esc closes that first.
  if ($("#viewer").classList.contains("on")) return closeStructure();
  if (view === "graph" && picked != null) pick(null);
});
$("#runs").onclick = (e) => { const r = e.target.closest(".run"); if (r) select(r.dataset.id); };

async function tick() {
  try {
    await Promise.all([loadRuns(), loadDetail()]);
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("#updated").textContent = `update failed: ${e.message}`;
  }
  setTimeout(tick, POLL_MS);
}
tick();
</script>
</body>
</html>
