<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-dag hypotheses</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pending: #9ca3af; --running: #2563eb; --done: #16a34a; --skipped: #d1d5db; --failed: #dc2626;
    --amber: #d97706; --accent-bg: #eef2ff; --blocked: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b313c;
      --pending: #6b7280; --running: #60a5fa; --done: #4ade80; --skipped: #3a404b; --failed: #f87171;
      --amber: #fbbf24; --accent-bg: #1f2740; --blocked: #a78bfa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header nav { display: flex; gap: 12px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a.here { color: var(--text); font-weight: 600; }
  header #updated { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .goal { font-weight: 600; font-size: 15px; flex: 1 1 260px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .plan { white-space: pre-wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 12px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
  .s-building, .s-pending { background: var(--pending); }
  .s-running, .s-verifying, .s-critiquing { background: var(--running); }
  .s-achieved, .s-done { background: var(--done); }
  .s-not-achieved, .s-unverified { background: var(--amber); }
  .s-blocked { background: var(--blocked); }
  .s-failed { background: var(--failed); }
  .s-abandoned, .s-skipped { background: var(--skipped); color: var(--muted); }
  .panel { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 6px; }
  .panel.warn { border-color: var(--amber); }
  .panel.block { border-color: var(--blocked); }
  .hint { font-size: 12px; margin-top: 4px; }
  .unheld { color: var(--amber); font-weight: 600; }
  .held { color: var(--done); font-weight: 600; }
  pre { margin: 0; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-size: 12px; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: inherit; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--running); border-color: var(--running); color: #fff; font-weight: 600; }
  button:disabled { opacity: .6; cursor: default; }
  .strip { display: flex; flex-direction: column; gap: 6px; }
  .strip a { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; color: inherit; text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  .strip a:hover { background: var(--accent-bg); }
  .strip .why { color: var(--muted); min-width: 0; }
  .err { color: var(--failed); white-space: pre-wrap; }
  .verdict { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
  .verdict.yes { border-color: var(--done); }
  .verdict.no { border-color: var(--amber); }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td code { font-size: 12px; }
  a { color: var(--running); }
  .crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .crumbs a, .crumbs b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
  .crumbs a { color: var(--muted); }
  .crumbs b { color: var(--text); font-weight: 500; }
  h2 { font-size: 18px; margin: 0; }
  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; color: inherit; text-decoration: none; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--accent-bg); }
  .row .title { font-weight: 600; min-width: 0; }
  .row .summary { color: var(--text); min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .row .tally { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .line { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  @media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr); } .row .side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses" class="here">Hypotheses</a><a href="/requests">Requests</a><a href="/new">New</a></nav>
  <span id="updated"></span>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<script>
const POLL_MS = 3000;
// Drives the tally order AND what the tally can see: a status missing from here is
// silently dropped from every count. Keep it in step with HypothesisStatus in app.py.
const STATUSES = ["achieved", "not achieved", "unverified", "blocked", "abandoned",
                  "failed", "critiquing", "verifying", "running", "building"];
const SCAFFOLD = (name) => `uv run python -m temporal.scaffold_node ${name}`;
let rows = null;    // The last /api/hypotheses response.
let last = "";      // What was last drawn, to redraw only on change.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (status) => `s-${status.replace(/ /g, "-")}`;
const badge = (status) => `<span class="badge ${cls(status)}">${status}</span>`;
const when = (t) => new Date(t).toLocaleString();
// A sequence is thousands of bases long, so show its ends and its length, never all of it.
const preview = (s) => s.length > 48 ? `${s.slice(0, 24)}…${s.slice(-8)}` : s;
const showValue = (v) => v == null ? ""
  : v.kind === "dna" ? `${preview(v.sequence)} (${v.sequence.length} bases)`
  : v.kind === "amino_acid_sequence" ? `${preview(v.sequence)} (${v.sequence.length} aa)`
  : v.kind === "score" ? `value = ${v.value}`
  : JSON.stringify(v);
const chips = (values) => Object.entries(values).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(showValue(v))}</span>`).join("");

// Where we are: all goals, one goal, or one hypothesis. Kept in the URL.
const route = () => Object.fromEntries(new URLSearchParams(location.search));
const href = (params) => `/hypotheses${Object.keys(params).length ? "?" + new URLSearchParams(params) : ""}`;

// Hypotheses grouped by goal, the most recently updated goal first.
function goals() {
  const by = new Map();
  for (const r of rows) {
    if (!by.has(r.hypothesis.goal)) by.set(r.hypothesis.goal, []);
    by.get(r.hypothesis.goal).push(r);
  }
  return [...by].map(([goal, rs]) => ({ goal, rows: rs, updated: rs[0].updated }));
}

function tally(rs) {
  return STATUSES.map((s) => [s, rs.filter((r) => r.status === s).length]).filter(([, n]) => n)
    .map(([s, n]) => `<span>${badge(s)} ${n}</span>`).join("");
}

function goalsView() {
  const gs = goals();
  if (!gs.length) return `<div class="empty">No hypotheses yet. Run one with<br>
    <code>uv run python -m temporal.run_hypothesis examples/score.json --model …</code></div>`;
  return `
    <div class="counts"><span><b>${gs.length}</b> goals, <b>${rows.length}</b> hypotheses</span></div>
    <div class="rows">${gs.map((g) => `
      <a class="row" href="${href({ goal: g.goal })}">
        <div class="title">${esc(g.goal)}</div>
        <div class="side"><div class="tally">${tally(g.rows)}</div></div>
        <div class="meta">${g.rows.length} ${g.rows.length === 1 ? "hypothesis" : "hypotheses"}</div>
        <div class="meta">updated ${when(g.updated)}</div>
      </a>`).join("")}
    </div>`;
}

function crumbs(goal, id) {
  const parts = [`<a href="${href({})}">All goals</a>`];
  if (goal != null) parts.push(id ? `<a href="${href({ goal })}">${esc(goal)}</a>` : `<b>${esc(goal)}</b>`);
  if (id) parts.push(`<b>${esc(id)}</b>`);
  return `<nav class="crumbs">${parts.join(" <span>›</span> ")}</nav>`;
}

function goalView(goal) {
  const rs = rows.filter((r) => r.hypothesis.goal === goal);
  if (!rs.length) return `${crumbs(goal)}<div class="empty">No hypotheses for this goal.</div>`;
  return `
    ${crumbs(goal)}
    <h2>${esc(goal)}</h2>
    <div class="counts"><span><b>${rs.length}</b> ${rs.length === 1 ? "hypothesis" : "hypotheses"}</span>${tally(rs)}</div>
    <div class="rows">${rs.map((r) => {
      const h = r.hypothesis;
      return `
      <a class="row" href="${href({ id: h.id })}">
        <div class="line">${badge(r.status)}<span class="summary">${h.hypothesis ? esc(h.hypothesis) : `<span class="meta">The builder agent is writing it…</span>`}</span></div>
        <div class="side"><span class="meta">${when(r.updated)}</span></div>
        <div class="chips">${chips(h.inputs)}</div>
        <div class="side">${h.verdict ? `<span class="meta">${h.verdict.achieved ? "goal achieved" : "goal not achieved"}</span>` : ""}</div>
      </a>`;
    }).join("")}
    </div>`;
}

// The latest attempt and its plan. Hypothesis mirrors the current attempt in its flat
// fields, but the plan, the critique and the prediction only live on the attempt.
const latest = (h) => (h.attempts ?? []).at(-1) ?? null;
const planOf = (h) => latest(h)?.plan ?? null;

// Which assertion sources fired. Decisions use "<step>.<branch>"; a produced assertion
// uses the tool/scorer step itself, exactly as node_dag.plan.Assertion.source() does.
const assertionSource = (a) => a.branch === "produced" ? a.step : `${a.step}.${a.branch}`;
function heldSources(h) {
  const values = h.outcome?.values ?? {};
  const held = {};
  for (const a of planOf(h)?.assertions ?? []) held[assertionSource(a)] = assertionSource(a) in values;
  return held;
}

// One row per step: its node, sources, status and value.
function steps(row) {
  const h = row.hypothesis, p = row.progress;
  const values = h.outcome?.values ?? p?.values ?? {};
  const skipped = new Set(h.outcome?.skipped ?? []);
  return Object.entries(h.dag.steps).map(([k, step]) => {
    const { name, ...args } = step.config;
    const params = Object.entries(args).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(", ");
    const branch = ["yes", "no"].find((b) => `${k}.${b}` in values);
    const status = p?.steps[k] ?? (skipped.has(k) ? "skipped" : k in values || branch ? "done" : "pending");
    return {
      key: k, status, node: params ? `${name}(${params})` : name, sources: step.inputs,
      value: branch ? `→ ${branch}: ${showValue(values[`${k}.${branch}`])}` : showValue(values[k]),
      why: planOf(h)?.steps?.[k]?.why ?? "",
    };
  });
}

// The acceptance rule, made visible: every criterion, whether an assertion covers it,
// and whether that assertion held. A criterion with no assertion is why a run ends
// "unverified" rather than achieved — nothing in the DAG could check it.
function coverageView(h) {
  const plan = planOf(h), held = heldSources(h);
  // Until the DAG has run there are no branches to read, so an assertion is pending
  // rather than failed — the difference matters while a run is blocked on a tool.
  const ran = !!(latest(h)?.outcome ?? h.outcome);
  const assertions = plan?.assertions ?? [];
  const rows = h.criteria.map((c) => ({ criterion: c, tests: assertions.filter((a) => a.criterion === c.id) }));
  const orphans = assertions.filter((a) => !h.criteria.some((c) => c.id === a.criterion));
  const uncovered = rows.filter((r) => !r.tests.length).length;
  return `
    <div>
      <div class="label">Criteria vs assertions: ${h.criteria.length} criteria, ${assertions.length} assertions</div>
      <div class="table"><table>
        <thead><tr><th>Criterion</th><th>Must be true</th><th>Asserted by</th><th>Held</th></tr></thead>
        <tbody>${rows.map(({ criterion: c, tests }) => `
          <tr>
            <td><code>${esc(c.id)}</code><br><span class="meta">${esc(c.source)}</span></td>
            <td>${esc(c.claim)}</td>
            <td>${tests.length ? tests.map((a) => `<code>${esc(a.step)}.${esc(a.branch)}</code> ${esc(a.claim)}`).join("<br>") : `<span class="unheld">no assertion covers it</span>`}</td>
            <td>${tests.length ? tests.map((a) => held[assertionSource(a)] ? `<span class="held">held</span>` : (ran ? `<span class="unheld">did not hold</span>` : `<span class="meta">not run yet</span>`)).join("<br>") : "—"}</td>
          </tr>`).join("")}${orphans.map((a) => `
          <tr>
            <td><code>${esc(a.criterion)}</code><br><span class="meta">not a criterion</span></td>
            <td class="unheld">No criterion with this id. It cannot count towards acceptance.</td>
            <td><code>${esc(a.step)}.${esc(a.branch)}</code> ${esc(a.claim)}</td>
            <td>—</td>
          </tr>`).join("")}</tbody>
      </table></div>
      ${uncovered ? `<div class="hint meta">${uncovered} criteria have no assertion, so this run can only end <b>unverified</b>: nothing in the DAG checks them. That becomes a request for a checking node.</div>` : ""}
    </div>`;
}

// What a human must write before this run can carry on. Per pending request: the full
// contract, the scaffold command, what re-resolving found, and the two ways out.
function blockedView(h) {
  const att = latest(h);
  return (h.pending ?? []).map((r) => `
    <div class="panel block">
      <div class="label">Blocked on a node that does not exist: <code>${esc(r.name)}</code></div>
      <div><b>${esc(r.name)}</b> — ${esc(r.node)}, ${esc(r.category)}</div>
      <div>${esc(r.purpose)}</div>
      <div class="table"><table>
        <thead><tr><th>Port</th><th>Kind</th></tr></thead>
        <tbody>${Object.entries(r.inputs).map(([port, kind]) => `
          <tr><td><code>${esc(port)}</code></td><td><code>${esc(kind)}</code></td></tr>`).join("")}
          ${r.output ? `<tr><td><code>output</code></td><td><code>${esc(r.output)}</code></td></tr>` : ""}
          ${r.forwards ? `<tr><td><code>forwards</code></td><td><code>${esc(r.forwards)}</code></td></tr>` : ""}
        </tbody>
      </table></div>
      ${r.config_fields.length ? `<div class="table"><table>
        <thead><tr><th>Config field</th><th>Type</th><th>Required</th><th>Default</th><th>What it controls</th></tr></thead>
        <tbody>${r.config_fields.map((f) => `
          <tr>
            <td><code>${esc(f.name)}</code></td><td><code>${esc(f.type)}</code></td>
            <td>${f.required ? "yes" : "no"}</td>
            <td><code>${esc(f.default == null ? "—" : JSON.stringify(f.default))}</code></td>
            <td>${esc(f.description)}</td>
          </tr>`).join("")}</tbody>
      </table></div>` : `<div class="meta">No config fields.</div>`}
      <div><div class="label">Why it is needed</div>${esc(r.why_needed)}</div>
      <div><div class="label">Why it cannot be composed</div>${esc(r.why_not_composable)}</div>
      <div><div class="label">Example</div><pre>${esc(r.example)}</pre></div>
      <div>
        <div class="label">Scaffold it</div>
        <pre>${esc(SCAFFOLD(r.name))}</pre>
        <div class="hint meta">Then write <code>run</code>, register it in <code>factory.py</code> (the NodeConfig union and MAPPING), and <b>restart the worker</b> — the registry is read at import. Bump <code>version</code> after any later change to <code>run</code>, or the cache serves the old result.</div>
      </div>
      ${(att?.resumes ?? []).map((note) => `<div class="panel warn">${esc(note)}</div>`).join("")}
      <div class="buttons">
        <button class="primary" data-act="tool-added" data-id="${esc(h.id)}">Tool added — resume</button>
        <button data-act="abandon" data-id="${esc(h.id)}">Abandon</button>
      </div>
      <div class="err" id="act-error"></div>
    </div>`).join("");
}

// Round, how it ended, its score and one line of verdict, each linking to its run graph.
function attemptsView(h) {
  const status = (a) => a.error ? "failed"
    : a.verdict ? (a.verdict.achieved ? "achieved" : "not achieved")
    : a.requests.length ? "blocked" : "running";
  return `
    <div>
      <div class="label">Attempts: ${h.attempts.length} ${h.attempts.length === 1 ? "round" : "rounds"}${h.stopped_because ? `, stopped because ${esc(h.stopped_because)}` : ""}</div>
      <div class="strip">${h.attempts.map((a) => {
        const line = a.error ?? a.verdict?.reason ?? a.critique?.diagnosis ?? "";
        const body = `
          <span class="meta">round ${a.round}</span>
          ${badge(status(a))}
          <span class="meta">${a.verdict ? `score ${a.verdict.score.toFixed(2)}` : "no score"}</span>
          <span class="why">${esc(line)}</span>`;
        return a.workflow_id
          ? `<a href="/?run=${encodeURIComponent(a.workflow_id)}">${body}</a>`
          : `<a>${body}</a>`;
      }).join("")}</div>
    </div>`;
}

function detailView(id) {
  const row = rows.find((r) => r.hypothesis.id === id);
  if (!row) return `${crumbs(null, id)}<div class="empty">No hypothesis ${esc(id)}.</div>`;
  const h = row.hypothesis;
  const produced = h.outcome ? Object.fromEntries(Object.entries(h.outcome.values).filter(([k]) => !(k in h.inputs))) : null;
  const plan = planOf(h), crit = h.critique ?? latest(h)?.critique ?? null;
  const tokens = Object.values(h.usage ?? {}).reduce((a, b) => a + b, 0);
  return `
    ${crumbs(h.goal, id)}
    <article class="card">
      <div class="top">
        ${badge(row.status)}
        <span class="goal">${esc(h.goal)}</span>
        <span class="meta">updated ${when(row.updated)}</span>
      </div>
      <div class="id">${esc(h.id)}</div>
      <div class="meta">round ${h.round ?? 0}${h.best_score ? `, best score ${h.best_score.toFixed(2)}` : ""}${tokens ? `, ${tokens.toLocaleString()} tokens` : ""}</div>
      <div><div class="label">Inputs</div><div class="chips">${chips(h.inputs)}</div></div>
      <div><div class="label">Hypothesis</div><div class="plan">${h.hypothesis ? esc(h.hypothesis) : `<span class="meta">The builder agent is writing it…</span>`}</div></div>
      ${h.criteria.length ? coverageView(h) : h.state === "building" ? `<div class="panel"><span class="meta">Working out what would count as meeting this goal. They are frozen once set, so the builder cannot choose what it is marked against.</span></div>` : `<div class="panel warn">This hypothesis has no criteria, so no run against it can be accepted.</div>`}
      ${h.state === "blocked" ? blockedView(h) : ""}
      ${produced ? `<div><div class="label">Outcome</div><div class="chips">${Object.keys(produced).length ? chips(produced) : `<span class="meta">No step produced a value.</span>`}</div></div>` : ""}
      ${plan?.expected ? `
      <div class="panel ${h.verdict?.prediction_held ? "" : "warn"}">
        <div class="label">Prediction</div>
        <div>${esc(plan.expected)}</div>
        ${h.verdict ? `<div>${h.verdict.prediction_held ? `<span class="held">The prediction held</span>: every assertion's branch fired.` : `<span class="unheld">The prediction did not hold</span>: at least one assertion's branch did not fire.`}</div>` : `<span class="meta">Not judged yet.</span>`}
      </div>` : ""}
      ${h.verdict ? `
      <div class="verdict ${h.verdict.achieved ? "yes" : "no"}">
        <div class="label">Verdict: ${h.verdict.achieved ? "goal achieved" : "goal not achieved"}</div>
        <div>${esc(h.verdict.reason)}</div>
        <div class="meta">the verifier ${h.verdict.agrees ? "agrees" : "does not agree"} the goal was met · assertions ${h.verdict.covers_goal ? "cover" : "do not cover"} the goal · score ${h.verdict.score.toFixed(2)}</div>
      </div>` : ""}
      ${crit ? `
      <div class="panel warn">
        <div class="label">Critique: ${esc(crit.root_cause)}</div>
        <div>${esc(crit.diagnosis)}</div>
        <div><div class="label">Evidence</div><div class="chips">${crit.evidence.map((e) => `<span class="chip">${esc(e)}</span>`).join("")}</div></div>
        ${crit.keep.length ? `<div><div class="label">Keep</div><div class="chips">${crit.keep.map((k) => `<span class="chip">${esc(k)}</span>`).join("")}</div></div>` : ""}
        <div><div class="label">Fix</div>${esc(crit.fix)}</div>
        <div><div class="label">Why this diagnosis</div>${esc(crit.reason)}</div>
      </div>` : ""}
      ${plan && Object.keys(plan.reasons).length ? `
      <div>
        <div class="label">Why these nodes</div>
        <div class="table"><table>
          <thead><tr><th>Node</th><th>Reason</th></tr></thead>
          <tbody>${Object.entries(plan.reasons).map(([node, why]) => `
            <tr><td><code>${esc(node)}</code></td><td>${esc(why)}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>` : ""}
      ${h.attempts?.length ? attemptsView(h) : ""}
      ${h.dag ? `
      <div>
        <div class="label">DAG: ${Object.keys(h.dag.steps).length} steps${h.outcome?.skipped.length ? `, ${h.outcome.skipped.length} skipped` : ""}</div>
        <div class="table"><table>
          <thead><tr><th>Step</th><th>Status</th><th>Node</th><th>Inputs</th><th>Value</th>${plan ? "<th>Why</th>" : ""}</tr></thead>
          <tbody>${steps(row).map((s) => `
            <tr>
              <td><code>${esc(s.key)}</code></td>
              <td>${badge(s.status)}</td>
              <td><code>${esc(s.node)}</code></td>
              <td>${Object.entries(s.sources).map(([port, src]) => `<code>${esc(port)} ← ${esc(src)}</code>`).join("<br>")}</td>
              <td><code>${esc(s.value)}</code></td>
              ${plan ? `<td>${esc(s.why)}</td>` : ""}
            </tr>`).join("")}</tbody>
        </table></div>
        ${h.workflow_id ? `<p style="margin:8px 0 0"><a href="/?run=${encodeURIComponent(h.workflow_id)}">Open the run's graph →</a></p>` : ""}
      </div>` : ""}
    </article>`;
}

function render() {
  if (!rows) return;
  const r = route();
  const key = JSON.stringify([r, rows]);
  if (key === last) return;
  last = key;
  $("#view").innerHTML = r.id ? detailView(r.id) : r.goal != null ? goalView(r.goal) : goalsView();
}

// Follow links inside the page without a reload, so the back button still works.
$("#view").addEventListener("click", (e) => {
  const a = e.target.closest("a[href^='/hypotheses']");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  history.pushState(null, "", a.getAttribute("href"));
  scrollTo(0, 0);
  render();
});
addEventListener("popstate", render);

// Resume a blocked run, or give up on it. Both signal the workflow by hypothesis id.
$("#view").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  for (const other of $("#view").querySelectorAll("button[data-act]")) other.disabled = true;
  const err = $("#act-error");
  if (err) err.textContent = "";
  try {
    const r = await fetch(`/api/hypotheses/${encodeURIComponent(b.dataset.id)}/${b.dataset.act}`, { method: "POST" });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    last = "";          // The state changes on the worker's clock, so force a redraw.
  } catch (ex) {
    if (err) err.textContent = ex.message;
    for (const other of $("#view").querySelectorAll("button[data-act]")) other.disabled = false;
  }
});

async function tick() {
  try {
    const r = await fetch("/api/hypotheses");
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    rows = await r.json();
    render();
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("#updated").textContent = `update failed: ${e.message}`;
  }
  setTimeout(tick, POLL_MS);
}
tick();
</script>
</body>
</html>
