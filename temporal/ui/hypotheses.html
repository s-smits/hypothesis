<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-dag hypotheses</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pending: #9ca3af; --running: #2563eb; --done: #16a34a; --skipped: #d1d5db; --failed: #dc2626;
    --amber: #d97706; --accent-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b313c;
      --pending: #6b7280; --running: #60a5fa; --done: #4ade80; --skipped: #3a404b; --failed: #f87171;
      --amber: #fbbf24; --accent-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header nav { display: flex; gap: 12px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a.here { color: var(--text); font-weight: 600; }
  header #updated { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .goal { font-weight: 600; font-size: 15px; flex: 1 1 260px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .plan { white-space: pre-wrap; }
  pre { margin: 0; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 12px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
  .s-building, .s-pending { background: var(--pending); }
  .s-running, .s-verifying { background: var(--running); }
  .s-achieved, .s-done { background: var(--done); }
  .s-not-achieved { background: var(--amber); }
  .s-failed { background: var(--failed); }
  .s-blocked { background: var(--amber); }
  .s-critiquing { background: var(--running); }
  .s-abandoned { background: var(--skipped); color: var(--muted); }
  button { font: inherit; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: inherit; padding: 4px 12px; cursor: pointer; }
  .s-skipped { background: var(--skipped); color: var(--muted); }
  .verdict { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
  .verdict.yes { border-color: var(--done); }
  .verdict.no { border-color: var(--amber); }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td code { font-size: 12px; }
  td.obs { min-width: 220px; max-width: 340px; }
  a { color: var(--running); }
  .crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .crumbs a, .crumbs b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60ch; }
  .crumbs a { color: var(--muted); }
  .crumbs b { color: var(--text); font-weight: 500; }
  h2 { font-size: 18px; margin: 0; }
  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; color: inherit; text-decoration: none; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--accent-bg); }
  .row .title { font-weight: 600; min-width: 0; }
  .row .summary { color: var(--text); min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .row .tally { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .line { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  @media (max-width: 600px) { .row { grid-template-columns: minmax(0, 1fr); } .row .side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; } }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses" class="here">Hypotheses</a><a href="/observations">Observations</a><a href="/new">New</a><a href="/nodes">Nodes</a></nav>
  <span id="updated"></span>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<script>
const POLL_MS = 3000;
const STATUSES = ["achieved", "not achieved", "failed", "abandoned", "blocked", "critiquing", "verifying", "running", "building"];
let rows = null;    // The last /api/hypotheses response.
let last = "";      // What was last drawn, to redraw only on change.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (status) => `s-${status.replace(" ", "-")}`;
const badge = (status) => `<span class="badge ${cls(status)}">${status}</span>`;
const when = (t) => new Date(t).toLocaleString();
const showValue = (v) => v == null ? "" : Array.isArray(v) ? `${v.length} × ${v[0]?.kind ?? "empty"}` : v.items ? `${v.items.length} × ${v.items[0]?.kind ?? "empty"}${Object.keys(v.scores).length ? `, scores: ${Object.keys(v.scores).join(", ")}` : ""}` : JSON.stringify(v);
// This round's attempt: its plan, DAG, outcome and verdict. Missing while the builder plans.
const cur = (h) => h.attempts.find((a) => a.round === h.round);
// The builder's plan once there is one, else the idea the user gave.
const idea = (h) => cur(h)?.plan?.hypothesis ?? h.hypothesis;
const noIdea = (status) => status === "building" ? "The builder agent is writing it…" : "No plan was written.";
const STOPPED = new Set(["achieved", "not achieved", "abandoned", "failed"]);
// The inputs, with where each came from when the agent fetched it, or why there are none yet.
const inputChips = (h) => Object.keys(h.inputs).length
  ? Object.entries(h.inputs).map(([k, v]) => `<span class="chip"${h.input_sources?.[k] ? ` title="${esc(h.input_sources[k])}"` : ""}>${esc(k)}: ${esc(showValue(v))}</span>`).join("")
  : `<span class="meta">${STOPPED.has(h.state) ? "No inputs were found." : "The agent is fetching them…"}</span>`;
const chips = (values) => Object.entries(values).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(showValue(v))}</span>`).join("");

const obsHref = (o) => `/observations?${new URLSearchParams({ core: o.core, id: o.amass_id })}`;
const obsSource = (o) => [o.source, o.date].filter(Boolean).map(esc).join(", ");

// What the builder agent found in the literature, one row per record it cited.
function observations(obs, withHypothesis) {
  if (!obs.length) return "";
  return `<div class="table"><table>
    <thead><tr><th>Observation</th><th>Summary</th>${withHypothesis ? "<th>Hypothesis</th>" : ""}</tr></thead>
    <tbody>${obs.map((o) => `
      <tr>
        <td class="obs"><a href="${obsHref(o)}">${esc(o.title)}</a><div class="meta">${obsSource(o)}</div></td>
        <td>${esc(o.summary)}</td>
        ${withHypothesis ? `<td>${badge(o.row.status)}<br><a href="${href({ id: o.row.hypothesis.id })}" class="meta">${esc(o.row.hypothesis.id.replace("hypothesis-", "").slice(0, 8))}</a></td>` : ""}
      </tr>`).join("")}</tbody>
  </table></div>`;
}

// Where we are: all goals, one goal, or one hypothesis. Kept in the URL.
const route = () => Object.fromEntries(new URLSearchParams(location.search));
const href = (params) => `/hypotheses${Object.keys(params).length ? "?" + new URLSearchParams(params) : ""}`;

// Hypotheses grouped by goal, the most recently updated goal first.
function goals() {
  const by = new Map();
  for (const r of rows) {
    if (!by.has(r.hypothesis.goal)) by.set(r.hypothesis.goal, []);
    by.get(r.hypothesis.goal).push(r);
  }
  return [...by].map(([goal, rs]) => ({ goal, rows: rs, updated: rs[0].updated }));
}

function tally(rs) {
  return STATUSES.map((s) => [s, rs.filter((r) => r.status === s).length]).filter(([, n]) => n)
    .map(([s, n]) => `<span>${badge(s)} ${n}</span>`).join("");
}

function goalsView() {
  const gs = goals();
  if (!gs.length) return `<div class="empty">No hypotheses yet. Run one with<br>
    <code>uv run python -m temporal.run_hypothesis examples/simple.json</code></div>`;
  return `
    <div class="counts"><span><b>${gs.length}</b> goals, <b>${rows.length}</b> hypotheses</span></div>
    <div class="rows">${gs.map((g) => `
      <a class="row" href="${href({ goal: g.goal })}">
        <div class="title">${esc(g.goal)}</div>
        <div class="side"><div class="tally">${tally(g.rows)}</div></div>
        <div class="meta">${g.rows.length} ${g.rows.length === 1 ? "hypothesis" : "hypotheses"}</div>
        <div class="meta">updated ${when(g.updated)}</div>
      </a>`).join("")}
    </div>`;
}

function crumbs(goal, id) {
  const parts = [`<a href="${href({})}">All goals</a>`];
  if (goal != null) parts.push(id ? `<a href="${href({ goal })}">${esc(goal)}</a>` : `<b>${esc(goal)}</b>`);
  if (id) parts.push(`<b>${esc(id)}</b>`);
  return `<nav class="crumbs">${parts.join(" <span>›</span> ")}</nav>`;
}

function goalView(goal) {
  const rs = rows.filter((r) => r.hypothesis.goal === goal);
  if (!rs.length) return `${crumbs(goal)}<div class="empty">No hypotheses for this goal.</div>`;
  return `
    ${crumbs(goal)}
    <h2>${esc(goal)}</h2>
    <div class="counts"><span><b>${rs.length}</b> ${rs.length === 1 ? "hypothesis" : "hypotheses"}</span>${tally(rs)}<a href="/new?goal=${encodeURIComponent(goal)}">+ New hypothesis</a></div>
    <div class="rows">${rs.map((r) => {
      const h = r.hypothesis;
      return `
      <a class="row" href="${href({ id: h.id })}">
        <div class="line">${badge(r.status)}<span class="summary">${idea(h) ? esc(idea(h)) : `<span class="meta">${noIdea(r.status)}</span>`}</span></div>
        <div class="side"><span class="meta">${when(r.updated)}</span></div>
        <div class="chips">${inputChips(h)}</div>
        <div class="side">${cur(h)?.verdict ? `<span class="meta">${cur(h).verdict.achieved ? "goal achieved" : "goal not achieved"}</span>` : ""}</div>
      </a>`;
    }).join("")}
    </div>
    ${goalObservations(rs)}`;
}

function goalObservations(rs) {
  const obs = rs.flatMap((r) => (r.hypothesis.observations ?? []).map((o) => ({ ...o, row: r })));
  if (!obs.length) return "";
  const records = new Set(obs.map((o) => o.amass_id)).size;
  return `
    <h2>Observations</h2>
    <div class="counts"><span><b>${obs.length}</b> from <b>${records}</b> ${records === 1 ? "record" : "records"} in the literature</span></div>
    <div class="card">${observations(obs, true)}</div>`;
}

// One row per step: its node, sources, status and value.
function steps(row) {
  const a = cur(row.hypothesis), p = row.progress;
  const values = a.outcome?.values ?? p?.values ?? {};
  const skipped = new Set(a.outcome?.skipped ?? []);
  return Object.entries(a.dag.steps).map(([k, step]) => {
    const { name, ...args } = step.config;
    const params = Object.entries(args).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(", ");
    const branch = ["yes", "no"].find((b) => `${k}.${b}` in values);
    const status = p?.steps[k] ?? (skipped.has(k) ? "skipped" : k in values || branch ? "done" : "pending");
    return {
      key: k, status, node: params ? `${name}(${params})` : name, sources: step.inputs,
      value: branch ? `→ ${branch}: ${showValue(values[`${k}.${branch}`])}` : showValue(values[k]),
    };
  });
}

// What the latest round's assertions say about each criterion.
function criteriaView(h) {
  if (!h.criteria.length) return "";
  const att = cur(h), ran = att && Object.keys(att.held).length > 0;
  const state = (c) => {
    const a = att?.plan?.assertions.find((x) => x.criterion === c.id);
    if (!a) return att?.plan ? "no assertion covers it" : "no plan yet";
    return !ran ? "not run yet" : att.held[`${a.step}.${a.branch}`] ? "holds" : "did not hold";
  };
  return `<div><div class="label">Criteria</div><table><tbody>${h.criteria.map((c) => `
    <tr><td><code>${esc(c.id)}</code></td><td>${esc(c.claim)}</td><td>${esc(state(c))}</td></tr>`).join("")}</tbody></table></div>`;
}

function roundsView(h) {
  if (!h.attempts.length) return "";
  return `<div><div class="label">Rounds</div><table><thead><tr><th>#</th><th>Result</th><th>What happened</th></tr></thead><tbody>${h.attempts.map((a) => `
    <tr><td>${a.round}</td><td>${a.verdict ? badge(a.verdict.achieved ? "achieved" : "not achieved") : a.error ? badge("failed") : ""}</td>
    <td>${esc(a.critique?.fix ?? a.error ?? a.verdict?.reason ?? "")}</td></tr>`).join("")}</tbody></table></div>`;
}

// A requested node's contract, as the builder wrote it, and how to start writing it.
function requestView(r) {
  const fields = r.config_fields.map((f) => `
    <tr><td><code>${esc(f.name)}</code></td><td><code>${esc(f.type)}</code></td><td>${f.required ? "yes" : "no"}</td><td>${esc(f.description)}</td></tr>`).join("");
  return `<div><b>${esc(r.name)}</b> (${esc(r.node)}): ${esc(r.purpose)}
    <div class="meta">takes <code>${esc(r.port)}</code>: ${esc(r.kind)}${r.output ? `, gives ${esc([r.output].flat().join(", "))}` : ""}</div>
    ${fields ? `<div class="table"><table><thead><tr><th>Config field</th><th>Type</th><th>Required</th><th>What it controls</th></tr></thead><tbody>${fields}</tbody></table></div>` : ""}
    <div class="label">Why it is needed</div>${esc(r.why_needed)}
    <div class="label">Why it cannot be composed</div>${esc(r.why_not_composable)}
    <div class="label">Example</div><pre>${esc(r.example)}</pre>
    <div class="label">Scaffold it</div><pre>uv run python -m temporal.scaffold_node ${esc(r.name)}</pre></div>`;
}

function blockedView(h) {
  if (h.state !== "blocked") return "";
  const att = cur(h), pending = att?.requests ?? [], note = att?.error;
  const button = (signal, text) => `<button data-signal="${signal}" data-id="${esc(h.id)}">${text}</button>`;
  return `<div class="verdict no"><div class="label">Blocked: waiting for ${pending.map((r) => esc(r.name)).join(", ")}</div>
    ${pending.map(requestView).join("")}
    ${note ? `<div class="meta">${esc(note)}</div>` : ""}
    <p>Write <code>run</code>, register the node in <code>factory.py</code> (the NodeConfig union and MAPPING), and <b>restart the worker</b>: the registry is read at import. Then resume, and the same plan is resolved again.</p>
    ${button("tool_added", "Resume")} ${button("abandon", "Abandon")} <span class="meta" id="signal-error"></span></div>`;
}

function detailView(id) {
  const row = rows.find((r) => r.hypothesis.id === id);
  if (!row) return `${crumbs(null, id)}<div class="empty">No hypothesis ${esc(id)}.</div>`;
  const h = row.hypothesis, a = cur(h);
  const produced = a?.outcome ? Object.fromEntries(Object.entries(a.outcome.values).filter(([k]) => !(k in h.inputs))) : null;
  return `
    ${crumbs(h.goal, id)}
    <article class="card">
      <div class="top">
        ${badge(row.status)}
        <span class="goal">${esc(h.goal)}</span>
        <span class="meta">updated ${when(row.updated)}</span>
      </div>
      <div class="id">${esc(h.id)}</div>
      <div><div class="label">Inputs</div><div class="chips">${inputChips(h)}</div></div>
      <div><div class="label">Hypothesis</div><div class="plan">${idea(h) ? esc(idea(h)) : `<span class="meta">${noIdea(row.status)}</span>`}</div></div>
      ${h.observations?.length ? `<div><div class="label">Observations from the literature</div>${observations(h.observations, false)}</div>` : ""}
      ${blockedView(h)}
      ${criteriaView(h)}
      ${roundsView(h)}
      ${h.stopped_because ? `<div class="meta">Stopped: ${esc(h.stopped_because)}${h.usage.total ? ` · ${h.usage.total} tokens` : ""}</div>` : ""}
      ${produced ? `<div><div class="label">Outcome</div><div class="chips">${Object.keys(produced).length ? chips(produced) : `<span class="meta">No step produced a value.</span>`}</div></div>` : ""}
      ${a?.verdict ? `
      <div class="verdict ${a.verdict.achieved ? "yes" : "no"}">
        <div class="label">Verdict: ${a.verdict.achieved ? "goal achieved" : "goal not achieved"}</div>
        <div>${esc(a.verdict.reason)}</div>
      </div>` : ""}
      ${a?.dag ? `
      <div>
        <div class="label">DAG: ${Object.keys(a.dag.steps).length} steps${a.outcome?.skipped.length ? `, ${a.outcome.skipped.length} skipped` : ""}</div>
        <div class="table"><table>
          <thead><tr><th>Step</th><th>Status</th><th>Node</th><th>Inputs</th><th>Value</th></tr></thead>
          <tbody>${steps(row).map((s) => `
            <tr>
              <td><code>${esc(s.key)}</code></td>
              <td>${badge(s.status)}</td>
              <td><code>${esc(s.node)}</code></td>
              <td>${Object.entries(s.sources).map(([port, src]) => `<code>${esc(port)} ← ${esc(src)}</code>`).join("<br>")}</td>
              <td><code>${esc(s.value)}</code></td>
            </tr>`).join("")}</tbody>
        </table></div>
        ${a.workflow_id ? `<p style="margin:8px 0 0"><a href="/?run=${encodeURIComponent(a.workflow_id)}">Open the run's graph →</a></p>` : ""}
      </div>` : ""}
    </article>`;
}

function render() {
  if (!rows) return;
  const r = route();
  const key = JSON.stringify([r, rows]);
  if (key === last) return;
  last = key;
  $("#view").innerHTML = r.id ? detailView(r.id) : r.goal != null ? goalView(r.goal) : goalsView();
}

$("#view").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-signal]");
  if (b) {
    b.disabled = true;
    const r = await fetch(`/api/hypotheses/${encodeURIComponent(b.dataset.id)}/${b.dataset.signal}`, { method: "POST" });
    if (!r.ok) {
      b.disabled = false;
      const why = await r.json().then((d) => d.detail).catch(() => null);
      $("#signal-error").textContent = `${b.textContent} failed: ${why ?? r.status}`;
    }
    return;
  }
  // Follow links inside the page without a reload, so the back button still works.
  const a = e.target.closest("a[href^='/hypotheses']");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  history.pushState(null, "", a.getAttribute("href"));
  scrollTo(0, 0);
  render();
});
addEventListener("popstate", render);

async function tick() {
  try {
    const r = await fetch("/api/hypotheses");
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    rows = await r.json();
    render();
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("#updated").textContent = `update failed: ${e.message}`;
  }
  setTimeout(tick, POLL_MS);
}
tick();
</script>
</body>
</html>
