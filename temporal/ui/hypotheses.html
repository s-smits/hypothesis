<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypotheses · node-dag</title>
<link rel="stylesheet" href="/ui.css">
<style>
  /* A goal, and the hypotheses under it. Both open in place. */
  .goal > summary {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 2px 10px;
    align-items: baseline; padding: 13px 16px; cursor: pointer; list-style: none;
  }
  .goal > summary::-webkit-details-marker { display: none; }
  .goal > summary:hover { background: var(--accent-bg); }
  .goal > summary::before { content: "›"; color: var(--muted); font-size: 15px; line-height: 1; transition: transform .15s; }
  .goal[open] > summary::before { transform: rotate(90deg); }
  .goal .title { font-weight: 600; }
  .goal .tally { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .goal > .body { padding: 0 16px 14px 40px; }

  .hyp { border-top: 1px solid var(--line); }
  .hyp > summary {
    display: grid; grid-template-columns: 14px auto minmax(0, 1fr) auto; gap: 10px;
    align-items: baseline; padding: 9px 0; cursor: pointer; list-style: none;
  }
  .hyp > summary::-webkit-details-marker { display: none; }
  .hyp > summary::before { content: "›"; color: var(--muted); font-size: 15px; line-height: 1; transition: transform .15s; }
  .hyp[open] > summary::before { transform: rotate(90deg); }
  .hyp .plan { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hyp > .body { padding: 2px 0 14px 24px; display: flex; flex-direction: column; gap: 10px; }
  .hyp .plan-full { white-space: pre-wrap; }

  .crits { margin: 0; padding-left: 18px; }
  .crits li + li { margin-top: 6px; }
  .crits .kind { color: var(--muted); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; }
  .obs + .obs { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .obs .title { font-weight: 500; }
  /* The record sits inside an observation, so it needs no rule of its own. */
  .obs details.sec { border-top: 0; }
  .obs details.sec > summary { padding: 4px 0 0; }
  .record { line-height: 1.6; max-width: 72ch; }
  .record p { margin: 0 0 .7em; }
  .record h3, .record h4 { margin: 1.1em 0 .3em; }
  .actions { display: flex; gap: 14px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses" class="here">Hypotheses</a><a href="/new">New</a><a href="/nodes">Nodes</a></nav>
  <span id="updated"></span>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<script>
const POLL_MS = 3000;
const STATUSES = ["achieved", "not achieved", "failed", "interrupted", "verifying", "running", "building"];
const STOPPED = new Set(["failed", "interrupted"]);
let rows = null;    // The last /api/hypotheses response.
let last = "";      // What was last drawn, to redraw only on change.
const open = new Set();   // Which goals and hypotheses the user has opened.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (status) => `s-${status.replace(/ /g, "-")}`;
const badge = (status) => `<span class="badge ${cls(status)}">${esc(status)}</span>`;
const when = (t) => new Date(t).toLocaleString();
const showValue = (v) => v == null ? "" : Array.isArray(v) ? `${v.length} × ${v[0]?.kind ?? "empty"}` : v.items ? `${v.items.length} × ${v.items[0]?.kind ?? "empty"}${Object.keys(v.scores).length ? `, scores: ${Object.keys(v.scores).join(", ")}` : ""}` : JSON.stringify(v);
const chips = (values) => Object.entries(values).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(showValue(v))}</span>`).join("");

// An expandable section. `key` keeps it open across the poll's redraw.
const sec = (key, title, count, body) => !body ? "" : `
  <details class="sec" data-key="${esc(key)}"${open.has(key) ? " open" : ""}>
    <summary>${esc(title)}${count != null ? ` <span class="count">${count}</span>` : ""}</summary>
    <div class="body">${body}</div>
  </details>`;

// One criterion with the verifier's call on it, when it judged.
const criterionLine = (c, judgements = [], i) => {
  const j = (judgements ?? []).find((x) => x.criterion === i);
  const word = j ? (j.met === true ? "met" : j.met === false ? "not met" : "unclear") : null;
  const mark = word ? `${badge(word)} ` : "";
  return `<li>${mark}<span class="kind">${c.kind}</span> ${esc(c.text)}${j?.reason ? `<div class="meta">${esc(j.reason)}</div>` : ""}</li>`;
};

// The plan, or why there is none yet.
const plan = (row) => row.hypothesis.hypothesis ? esc(row.hypothesis.hypothesis)
  : `<span class="meta">${STOPPED.has(row.status) ? "The builder agent did not finish one." : "The builder agent is writing it…"}</span>`;
// Why it stopped: its own error, else its run's.
const why = (row) => row.hypothesis.error ?? row.progress?.error;

// The literature the run was built on. The record itself is fetched only if asked for.
function observations(obs, id) {
  return obs.map((o, i) => `
    <div class="obs">
      <div class="title">${o.url ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)} ↗</a>` : esc(o.title)}</div>
      <div class="meta">${[o.core, o.source, o.date].filter(Boolean).map(esc).join(" · ")}</div>
      <div>${esc(o.summary)}</div>
      ${o.used ? `<div class="meta">Builder: ${esc(o.used)}</div>` : ""}
      <details class="sec record-for" data-key="${esc(`r:${id}:${i}`)}" data-core="${esc(o.core)}" data-id="${esc(o.amass_id)}" data-hyp="${esc(id)}"${open.has(`r:${id}:${i}`) ? " open" : ""}>
        <summary>Record</summary>
        <div class="body"><span class="meta">Loading…</span></div>
      </details>
    </div>`).join("");
}

// One row per step: its node, sources, status and value.
function steps(row) {
  const h = row.hypothesis, p = row.progress;
  const values = h.outcome?.values ?? p?.values ?? {};
  const skipped = new Set(h.outcome?.skipped ?? []);
  return Object.entries(h.dag.steps).map(([k, step]) => {
    const { name, ...args } = step.config;
    const params = Object.entries(args).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(", ");
    const branch = ["yes", "no"].find((b) => `${k}.${b}` in values);
    const status = p?.steps[k] ?? (skipped.has(k) ? "skipped" : k in values || branch ? "done" : "pending");
    return {
      key: k, status, node: params ? `${name}(${params})` : name, sources: step.inputs,
      value: branch ? `→ ${branch}: ${showValue(values[`${k}.${branch}`])}` : showValue(values[k]),
    };
  });
}

function dagTable(row) {
  return `<div class="scroll"><table>
    <thead><tr><th>Step</th><th>Status</th><th>Node</th><th>Inputs</th><th>Value</th></tr></thead>
    <tbody>${steps(row).map((s) => `
      <tr>
        <td><code>${esc(s.key)}</code></td>
        <td>${badge(s.status)}</td>
        <td><code>${esc(s.node)}</code></td>
        <td>${Object.entries(s.sources).map(([port, src]) => `<code>${esc(port)} ← ${esc(src)}</code>`).join("<br>")}</td>
        <td><code>${esc(s.value)}</code></td>
      </tr>`).join("")}</tbody>
  </table></div>`;
}

// One hypothesis: its status and plan on the line, everything else behind a section.
function hypothesis(row) {
  const h = row.hypothesis, key = `h:${h.id}`;
  const produced = h.outcome ? Object.fromEntries(Object.entries(h.outcome.values).filter(([k]) => !(k in h.inputs))) : null;
  const obs = h.observations ?? [];
  const steps = h.dag ? Object.keys(h.dag.steps).length : 0;
  const body = `
    ${STOPPED.has(row.status) && why(row) ? `<div class="note error">${esc(why(row))}</div>` : ""}
    ${sec(`${key}:verdict`, h.verdict ? `Verdict · goal ${h.verdict.achieved ? "achieved" : "not achieved"}` : "", null,
      h.verdict ? `<div class="note ${h.verdict.achieved ? "yes" : "no"}">${esc(h.verdict.reason)}</div>` : "")}
    ${sec(`${key}:plan`, "Hypothesis", null, `<div class="plan-full">${plan(row)}</div>`)}
    ${sec(`${key}:crit`, "Success criteria", h.criteria?.length, h.criteria?.length
      ? `<ul class="crits">${h.criteria.map((c, i) => criterionLine(c, h.verdict?.criteria, i)).join("")}</ul>` : "")}
    ${sec(`${key}:obs`, "Observations", obs.length, obs.length ? observations(obs, h.id) : "")}
    ${sec(`${key}:dag`, "DAG", h.dag ? `${steps} ${steps === 1 ? "step" : "steps"}${h.outcome?.skipped.length ? `, ${h.outcome.skipped.length} skipped` : ""}` : null,
      h.dag ? dagTable(row) : "")}
    ${sec(`${key}:out`, "Outcome", produced ? Object.keys(produced).length : null,
      produced ? (Object.keys(produced).length ? `<div class="chips">${chips(produced)}</div>` : `<span class="meta">No step produced a value.</span>`) : "")}
    ${h.workflow_id ? `<div class="actions"><a href="/?run=${encodeURIComponent(h.workflow_id)}">Open the run's graph →</a></div>` : ""}`;
  return `
    <details class="hyp" id="${esc(key)}" data-key="${esc(key)}"${open.has(key) ? " open" : ""}>
      <summary>
        ${badge(row.status)}
        <span class="plan">${plan(row)}</span>
        <span class="meta">${when(row.updated)}</span>
      </summary>
      <div class="body">${body}</div>
    </details>`;
}

// Hypotheses grouped by goal, the most recently updated goal first.
function goals() {
  const by = new Map();
  for (const r of rows) {
    if (!by.has(r.hypothesis.goal)) by.set(r.hypothesis.goal, []);
    by.get(r.hypothesis.goal).push(r);
  }
  return [...by].map(([goal, rs]) => ({ goal, rows: rs }));
}

const tally = (rs) => STATUSES.map((s) => [s, rs.filter((r) => r.status === s).length])
  .filter(([, n]) => n).map(([s, n]) => `<span>${badge(s)} ${n}</span>`).join("");

function render() {
  if (!rows) return;
  const key = JSON.stringify([rows, [...open].sort()]);
  if (key === last) return;
  last = key;
  const gs = goals();
  $("#view").innerHTML = !gs.length
    ? `<div class="empty">No hypotheses yet. <a href="/new">Start one</a>.</div>`
    : `<div class="meta" style="margin-bottom:10px"><b>${gs.length}</b> ${gs.length === 1 ? "goal" : "goals"}, <b>${rows.length}</b> ${rows.length === 1 ? "hypothesis" : "hypotheses"}</div>
       <div class="rows">${gs.map((g) => {
         const k = `g:${g.goal}`;
         return `
         <details class="goal" data-key="${esc(k)}"${open.has(k) ? " open" : ""}>
           <summary>
             <span class="title">${esc(g.goal)}</span>
             <span class="tally">${tally(g.rows)}</span>
           </summary>
           <div class="body">
             ${g.rows.map(hypothesis).join("")}
             <div class="actions" style="padding-top:12px"><a href="/new?goal=${encodeURIComponent(g.goal)}">+ New hypothesis on this goal</a></div>
           </div>
         </details>`;
       }).join("")}</div>`;
}

// An Amass record, fetched the first time someone opens it.
async function loadRecord(el) {
  const body = el.querySelector(".body");
  if (el.dataset.loaded) return;
  el.dataset.loaded = "1";
  try {
    const r = await fetch(`/api/observations/${encodeURIComponent(el.dataset.core)}/${encodeURIComponent(el.dataset.id)}`);
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail ?? r.status);
    const rec = d.record;
    const text = rec.fulltext ?? rec.abstract ?? rec.description ?? "";
    // Where else this record was read the same way, which is worth knowing before
    // taking one hypothesis's summary of it at face value.
    const also = (d.cited_by ?? []).filter((c) => c.hypothesis_id !== el.dataset.hyp);
    body.innerHTML = (text
      ? `<div class="record">${text.split(/\n{2,}/).filter((p) => p.trim()).map((p) => `<p>${esc(p.replace(/^#{1,6}\s+/, "").trim())}</p>`).join("")}</div>`
      : `<span class="meta">Amass has no text for this record.</span>`)
      + (also.length ? `<div class="meta" style="margin-top:10px">Also cited by ${also.length} other ${also.length === 1 ? "hypothesis" : "hypotheses"}: ${also.map((c) => esc(c.goal)).join("; ")}</div>` : "");
  } catch (e) {
    el.dataset.loaded = "";
    body.innerHTML = `<span class="meta">Could not load the record: ${esc(e.message)}</span>`;
  }
}

// Remember what is open, so the poll's redraw does not close it. `toggle` does
// not bubble, so it is caught on the way down.
$("#view").addEventListener("toggle", (e) => {
  const el = e.target;
  if (!el.dataset.key) return;
  el.open ? open.add(el.dataset.key) : open.delete(el.dataset.key);
  if (el.open && el.classList.contains("record-for")) loadRecord(el);
}, true);

async function tick() {
  try {
    const r = await fetch("/api/hypotheses");
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    rows = await r.json();
    render();
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("#updated").textContent = `update failed: ${e.message}`;
  }
  setTimeout(tick, POLL_MS);
}

// A link from elsewhere names one hypothesis: open it and its goal.
const wanted = new URLSearchParams(location.search).get("id");
(async () => {
  await tick();
  if (!wanted || !rows) return;
  const row = rows.find((r) => r.hypothesis.id === wanted);
  if (!row) return;
  open.add(`g:${row.hypothesis.goal}`);
  open.add(`h:${wanted}`);
  render();
  document.getElementById(`h:${wanted}`)?.scrollIntoView({ block: "center" });
})();
</script>
</body>
</html>
