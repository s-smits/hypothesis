<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-dag hypotheses</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pending: #9ca3af; --running: #2563eb; --done: #16a34a; --skipped: #d1d5db; --failed: #dc2626;
    --amber: #d97706; --accent-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b313c;
      --pending: #6b7280; --running: #60a5fa; --done: #4ade80; --skipped: #3a404b; --failed: #f87171;
      --amber: #fbbf24; --accent-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header nav { display: flex; gap: 12px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a.here { color: var(--text); font-weight: 600; }
  header #updated { color: var(--muted); font-size: 12px; margin-left: auto; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  #list { display: flex; flex-direction: column; gap: 12px; }
  .empty { color: var(--muted); padding: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .goal { font-weight: 600; font-size: 15px; flex: 1 1 260px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .id { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .plan { white-space: pre-wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 12px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
  .s-building, .s-pending { background: var(--pending); }
  .s-running, .s-verifying { background: var(--running); }
  .s-achieved, .s-done { background: var(--done); }
  .s-not-achieved { background: var(--amber); }
  .s-failed { background: var(--failed); }
  .s-skipped { background: var(--skipped); color: var(--muted); }
  .verdict { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
  .verdict.yes { border-color: var(--done); }
  .verdict.no { border-color: var(--amber); }
  details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details[open] summary { margin-bottom: 8px; }
  .table { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td code { font-size: 12px; }
  a { color: var(--running); }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses" class="here">Hypotheses</a></nav>
  <span id="updated"></span>
</header>
<main>
  <div id="counts" class="counts"></div>
  <div id="list"><div class="empty">Loading…</div></div>
</main>
<script>
const POLL_MS = 3000;
const STATUSES = ["building", "running", "verifying", "achieved", "not achieved", "failed"];
const open = new Set();  // Hypothesis ids whose DAG section is expanded.
let last = "";           // The last response, to redraw only on change.

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (status) => `s-${status.replace(" ", "-")}`;
const showValue = (v) => v == null ? "" : v.kind === "foo_bar" ? `count = ${v.count}` : v.kind === "baz" ? `label = "${v.label}"` : JSON.stringify(v);

// One row per step: its node, sources, status and value.
function steps(row) {
  const h = row.hypothesis, p = row.progress;
  const values = h.outcome?.values ?? p?.values ?? {};
  const skipped = new Set(h.outcome?.skipped ?? []);
  return Object.entries(h.dag.steps).map(([k, step]) => {
    const { name, ...args } = step.config;
    const params = Object.entries(args).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(", ");
    const branch = ["yes", "no"].find((b) => `${k}.${b}` in values);
    const status = p?.steps[k] ?? (skipped.has(k) ? "skipped" : k in values || branch ? "done" : "pending");
    return {
      key: k, status, node: params ? `${name}(${params})` : name, sources: step.inputs,
      value: branch ? `→ ${branch}: ${showValue(values[`${k}.${branch}`])}` : showValue(values[k]),
    };
  });
}

function card(row) {
  const h = row.hypothesis;
  const inputs = Object.entries(h.inputs).map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(showValue(v))}</span>`).join("");
  // The values the steps produced, without the inputs it was given.
  const produced = h.outcome ? Object.entries(h.outcome.values).filter(([k]) => !(k in h.inputs)) : [];
  const outcome = h.outcome ? `
    <div><div class="label">Outcome</div><div class="chips">${produced.length
      ? produced.map(([k, v]) => `<span class="chip">${esc(k)}: ${esc(showValue(v))}</span>`).join("")
      : `<span class="meta">No step produced a value.</span>`}</div></div>` : "";
  const verdict = h.verdict ? `
    <div class="verdict ${h.verdict.achieved ? "yes" : "no"}">
      <div class="label">Verdict: ${h.verdict.achieved ? "goal achieved" : "goal not achieved"}</div>
      <div>${esc(h.verdict.reason)}</div>
    </div>` : "";
  const dag = h.dag ? `
    <details data-id="${esc(h.id)}" ${open.has(h.id) ? "open" : ""}>
      <summary>DAG: ${Object.keys(h.dag.steps).length} steps${h.outcome?.skipped.length ? `, ${h.outcome.skipped.length} skipped` : ""}</summary>
      <div class="table"><table>
        <thead><tr><th>Step</th><th>Status</th><th>Node</th><th>Inputs</th><th>Value</th></tr></thead>
        <tbody>${steps(row).map((s) => `
          <tr>
            <td><code>${esc(s.key)}</code></td>
            <td><span class="badge ${cls(s.status)}">${s.status}</span></td>
            <td><code>${esc(s.node)}</code></td>
            <td>${Object.entries(s.sources).map(([port, src]) => `<code>${esc(port)} ← ${esc(src)}</code>`).join("<br>")}</td>
            <td><code>${esc(s.value)}</code></td>
          </tr>`).join("")}</tbody>
      </table></div>
      ${h.workflow_id ? `<p style="margin:8px 0 0"><a href="/?run=${encodeURIComponent(h.workflow_id)}">Open the run's graph →</a></p>` : ""}
    </details>` : "";
  return `
    <article class="card">
      <div class="top">
        <span class="badge ${cls(row.status)}">${row.status}</span>
        <span class="goal">${esc(h.goal)}</span>
        <span class="meta">updated ${new Date(row.updated).toLocaleString()}</span>
      </div>
      <div class="id">${esc(h.id)}</div>
      ${inputs ? `<div><div class="label">Inputs</div><div class="chips">${inputs}</div></div>` : ""}
      <div><div class="label">Hypothesis</div><div class="plan">${h.hypothesis ? esc(h.hypothesis) : `<span class="meta">The builder agent is writing it…</span>`}</div></div>
      ${outcome}
      ${verdict}
      ${dag}
    </article>`;
}

function render(rows) {
  $("#counts").innerHTML = rows.length
    ? [`<span><b>${rows.length}</b> hypotheses</span>`, ...STATUSES.map((s) => [s, rows.filter((r) => r.status === s).length]).filter(([, n]) => n)
        .map(([s, n]) => `<span><span class="badge ${cls(s)}">${s}</span> ${n}</span>`)].join("")
    : "";
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : `
    <div class="empty">No hypotheses yet. Run one with<br>
    <code>uv run python -m temporal.run_hypothesis examples/double.json --model …</code></div>`;
  document.querySelectorAll("details[data-id]").forEach((d) => {
    d.ontoggle = () => d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
  });
}

async function tick() {
  try {
    const r = await fetch("/api/hypotheses");
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const text = await r.text();
    if (text !== last) { last = text; render(JSON.parse(text)); }
    $("#updated").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    $("#updated").textContent = `update failed: ${e.message}`;
  }
  setTimeout(tick, POLL_MS);
}
tick();
</script>
</body>
</html>
