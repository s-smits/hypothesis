<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>node-dag observations</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
    --pending: #9ca3af; --running: #2563eb; --done: #16a34a; --failed: #dc2626;
    --amber: #d97706; --accent-bg: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1e26; --text: #e5e7eb; --muted: #9ca3af; --line: #2b313c;
      --pending: #6b7280; --running: #60a5fa; --done: #4ade80; --failed: #f87171;
      --amber: #fbbf24; --accent-bg: #1f2740;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header nav { display: flex; gap: 12px; font-size: 13px; }
  header nav a { color: var(--muted); text-decoration: none; }
  header nav a.here { color: var(--text); font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; }
  .counts { display: flex; gap: 14px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
  .empty { color: var(--muted); padding: 20px 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .meta { color: var(--muted); font-size: 12px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font: 12px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .cite { border-left: 3px solid var(--running); padding: 6px 10px; background: var(--bg); border-radius: 0 6px 6px 0; }
  a { color: var(--running); }
  h2 { font-size: 18px; margin: 0; }
  .crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
  .crumbs a { color: var(--muted); }
  .rows { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--accent-bg); }
  .row .title { font-weight: 600; }
  .row .summary { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fulltext { line-height: 1.6; max-width: 75ch; }
  .fulltext h3, .fulltext h4 { margin: 1.2em 0 .3em; }
  .fulltext p { margin: 0 0 .8em; }
</style>
</head>
<body>
<header>
  <h1>node-dag</h1>
  <nav><a href="/">Runs</a><a href="/hypotheses">Hypotheses</a><a href="/observations" class="here">Observations</a><a href="/new">New</a><a href="/nodes">Nodes</a></nav>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<script>
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const route = Object.fromEntries(new URLSearchParams(location.search));
const obsHref = (core, id) => `/observations?${new URLSearchParams({ core, id })}`;
const hypHref = (id) => `/hypotheses?${new URLSearchParams({ id })}`;

// Full text comes as markdown. Draw its headings, lists and paragraphs; nothing more.
function markdown(md) {
  return md.split(/\n{2,}/).map((block) => {
    const b = block.trim();
    const h = b.match(/^(#{1,6})\s+(.*)$/s);
    if (h) return `<h${Math.min(h[1].length + 1, 4)}>${esc(h[2])}</h${Math.min(h[1].length + 1, 4)}>`;
    if (/^[-*] /m.test(b) && b.split("\n").every((l) => /^\s*[-*] /.test(l)))
      return `<ul>${b.split("\n").map((l) => `<li>${esc(l.replace(/^\s*[-*] /, ""))}</li>`).join("")}</ul>`;
    return b ? `<p>${esc(b)}</p>` : "";
  }).join("");
}

// Every cited record, with the hypotheses that cite it, the most cited first.
async function listView() {
  const rows = await (await fetch("/api/hypotheses")).json();
  const by = new Map();
  for (const r of rows) for (const o of r.hypothesis.observations ?? []) {
    if (!by.has(o.amass_id)) by.set(o.amass_id, { ...o, cites: [] });
    by.get(o.amass_id).cites.push({ ...o, hypothesis: r.hypothesis });
  }
  const records = [...by.values()].sort((a, b) => b.cites.length - a.cites.length);
  if (!records.length) return `<div class="empty">No observations yet. The builder agent records one when it searches the literature for a hypothesis.</div>`;
  return `
    <div class="counts"><span><b>${records.length}</b> records from the literature</span></div>
    <div class="rows">${records.map((o) => `
      <a class="row" href="${obsHref(o.core, o.amass_id)}">
        <div class="title">${esc(o.title)}</div>
        <div class="meta">${o.cites.length} ${o.cites.length === 1 ? "hypothesis" : "hypotheses"}</div>
        <div class="summary">${esc(o.cites[0].summary)}</div>
        <div class="meta">${[o.source, o.date].filter(Boolean).map(esc).join(", ")}</div>
      </a>`).join("")}
    </div>`;
}

async function detailView(core, id) {
  const r = await fetch(`/api/observations/${encodeURIComponent(core)}/${encodeURIComponent(id)}`);
  if (!r.ok) return `<div class="empty">Could not load ${esc(id)}: ${esc((await r.json()).detail ?? r.status)}</div>`;
  const { record: rec, cited_by } = await r.json();
  const people = names(rec.authors).length ? names(rec.authors) : names(rec.inventors);
  const facts = [rec.journal, ...names(rec.assignees), rec.publicationNumber, rec.publicationDate, rec.citationCount != null && `${rec.citationCount} citations`].filter(Boolean);
  // Whatever long text the record's core has: a paper's full text, a patent's claims and description.
  const texts = [
    rec.fulltext && ["Full text", markdown(rec.fulltext)],
    rec.claims && ["Claims", plain(rec.claims)],
    rec.description && ["Description", plain(rec.description)],
  ].filter(Boolean);
  const links = [rec.url && ["Source", rec.url], rec.doi && ["DOI", `https://doi.org/${rec.doi}`]].filter(Boolean);
  return `
    <nav class="crumbs"><a href="/observations">All observations</a> › <span>${esc(id)}</span></nav>
    <article class="card">
      <h2>${esc(rec.title ?? rec.name ?? id)}</h2>
      ${people.length ? `<div class="meta">${esc(people.join(", "))}</div>` : ""}
      <div class="chips">${facts.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}${links.map(([l, u]) => `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>
      ${cited_by.length ? `
      <div><div class="label">Cited by ${cited_by.length} ${cited_by.length === 1 ? "hypothesis" : "hypotheses"}</div>
        ${cited_by.map((c) => `
        <div class="cite">
          <div><a href="${hypHref(c.hypothesis_id)}">${esc(c.goal)}</a></div>
          <div>${esc(c.summary)}</div>
        </div>`).join("")}
      </div>` : ""}
      ${rec.abstract ? `<div><div class="label">Abstract</div><div class="fulltext"><p>${esc(rec.abstract)}</p></div></div>` : ""}
      ${texts.length ? texts.map(([label, html]) => `<div><div class="label">${label}</div><div class="fulltext">${html}</div></div>`).join("")
        : `<div><div class="label">Full text</div><div class="meta">Amass has no full text for this record.</div></div>`}
    </article>`;
}

// Patent text is plain, padded with runs of whitespace. A blank-ish line ends a paragraph.
const plain = (s) => s.split(/\s*\n\s*\n\s*|\n\s{4,}/).map((p) => p.replace(/\s+/g, " ").trim()).filter(Boolean).map((p) => `<p>${esc(p)}</p>`).join("");
// Authors are strings; patent inventors and assignees may be objects with a name.
const names = (xs) => (xs ?? []).map((x) => typeof x === "string" ? x : x?.name ?? "").filter(Boolean);

(async () => {
  try {
    $("#view").innerHTML = route.id ? await detailView(route.core ?? "biomedcore", route.id) : await listView();
  } catch (e) {
    $("#view").innerHTML = `<div class="empty">Failed to load: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
