[project]
name = "node-dag"
version = "0.1.0"
description = "Run a DAG of typed nodes as a Temporal workflow."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic",
    "temporalio",
    "click",
    "pydantic-ai-slim[anthropic]>=2.52.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "python-dotenv>=1.2.4",
    "ostir>=1.1.3",
    "viennarna>=2.7.2",
    "modal>=1.6.0",
    "biopython>=1.88",
    "mdtraj>=1.11.1.post2",
    "pdbfixer>=1.12.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["node_dag*", "temporal*"]

[tool.setuptools.package-dir]
"" = "src"
"temporal" = "temporal"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# This tree first, so a venv whose editable install points at another checkout is not used.
pythonpath = [".", "src"]
# The live test calls a paid model API: deselected unless asked for with `-m live`.
addopts = "-m 'not live'"
markers = ["live: calls a live model API; run with `pytest -m live`"]

[tool.ruff.lint.isort]
known-first-party = ["node_dag", "temporal"]

[tool.ruff.lint]
extend-select = ["I", "ANN", "D101", "D102", "D103"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D103"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

# A Modal app imports its packages inside the function, and only its image has them.
[[tool.ty.overrides]]
include = ["src/node_dag/nodes/tools/*/modal_app.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
